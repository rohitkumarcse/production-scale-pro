name: CI

# WHEN this pipeline runs.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel an in-progress run when you push again to the same branch,
# so you are not paying for CI on code you already replaced.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ==========================================================
  # JOB 1 — lint
  # ==========================================================
  # This exists because `node --check` is not enough. A lost
  # newline once turned `const MAX_REQUESTS = ...` into part of
  # the comment above it — valid syntax, so --check passed, but
  # every request crashed the balancer at runtime.
  # ESLint's no-undef catches exactly that.
  lint:
    name: lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install lint tooling
        run: npm ci

      - name: Lint
        run: npm run lint

  # ==========================================================
  # JOB 2 — per-package checks
  # ==========================================================
  # There is no package.json at the repo root, so there is no
  # single `npm ci` that works. A matrix runs these five packages
  # in parallel, each on its own runner.
  check:
    name: check (${{ matrix.package }})
    runs-on: ubuntu-latest

    strategy:
      # Don't cancel the other four when one fails — you want to
      # see every failure in one run, not discover them one by one.
      fail-fast: false
      matrix:
        package:
          - load-balancer
          - services-instance/node-1
          - services-instance/node-2
          - services-instance/node-3
          - services-instance/node-4

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          # The cache needs to know WHICH lockfile to hash.
          # Without this it looks in the repo root and finds nothing.
          cache-dependency-path: ${{ matrix.package }}/package-lock.json

      - name: Install dependencies
        working-directory: ${{ matrix.package }}
        run: npm ci

      - name: Check syntax
        working-directory: ${{ matrix.package }}
        # `node --check` parses a file without executing it.
        # A placeholder until there are real tests — it catches
        # typos and broken edits, nothing more. Replace with
        # `npm test` once you have a test script.
        run: |
          find . -name '*.js' -not -path './node_modules/*' -print0 \
            | xargs -0 -n1 node --check

      - name: Audit dependencies
        working-directory: ${{ matrix.package }}
        # Reports known CVEs. `|| true` means it informs without
        # blocking — drop that once the report is clean.
        run: npm audit --audit-level=high || true

  # ==========================================================
  # JOB 3 — build images and test the whole stack
  # ==========================================================
  # Build and integration live in ONE job on purpose. Every job
  # gets a fresh VM, so images built in another job would not
  # exist here. Moving them apart means uploading images as
  # artifacts — not worth it at this size.
  integration:
    name: integration
    runs-on: ubuntu-latest
    needs: [lint, check]  # only runs if lint and all five checks passed
    timeout-minutes: 15   # a hung compose stack should fail, not run forever

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build images
        # docker-compose.yml references pre-built tags (image: node-1:latest)
        # rather than build: contexts, so the tags must exist first.
        run: |
          docker build -t load-balancer:latest ./load-balancer
          for n in 1 2 3 4; do
            docker build -t node-$n:latest ./services-instance/node-$n
          done

      - name: Start stack
        # nginx is excluded deliberately: it needs ssl/nginx.crt,
        # and ssl/ is gitignored, so those certs do not exist on a
        # fresh checkout. Naming services explicitly also skips
        # anything else that needs local-only files.
        run: |
          docker compose up -d \
            mongodb node-1 node-2 node-3 node-4 load-balancer

      - name: Wait for backends to report healthy
        run: |
          for i in $(seq 1 45); do
            unhealthy=0
            for c in node-1 node-2 node-3 node-4; do
              status=$(docker inspect -f '{{.State.Health.Status}}' "$c" 2>/dev/null || echo missing)
              [ "$status" = healthy ] || unhealthy=1
            done
            if [ "$unhealthy" -eq 0 ]; then
              echo "all backends healthy after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "::error::backends never became healthy"
          docker compose ps
          exit 1

      - name: Wait for the balancer to accept traffic
        # Compose reports the container healthy before it has
        # necessarily served a real proxied request, so poll it.
        run: |
          for i in $(seq 1 40); do
            # Capture the actual status instead of using `curl -f`,
            # which reports a refused connection and an HTTP 503
            # as the same opaque failure.
            code=$(curl -s -o /dev/null -w '%{http_code}' -m 3 http://localhost:3000/ || echo 000)

            if [ "$code" = "200" ]; then
              echo "balancer up after ${i}s"
              exit 0
            fi

            # 000 = nothing listening. 503 = up, but it thinks every
            # backend is down. Print the transition, not every tick.
            [ "$code" != "$last" ] && echo "t=${i}s status=$code"
            last=$code
            sleep 1
          done

          echo "::error::balancer never returned 200 on :3000 (last status: $last)"
          echo "--- container states ---"
          docker compose ps
          echo "--- load-balancer logs ---"
          docker logs load-balancer --tail 50 2>&1 || echo "container has no logs / does not exist"
          echo "--- can the LB resolve its backends? ---"
          docker exec load-balancer node -e "
            require('http').get('http://node-1:3001/health', r => {
              console.log('node-1:3001 ->', r.statusCode);
            }).on('error', e => console.log('node-1:3001 ->', e.code));
          " 2>&1 || echo "exec failed — container not running"
          exit 1

      - name: Balancer returns 200
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' -m 5 http://localhost:3000/)
          echo "status=$code"
          [ "$code" = "200" ] || { echo "::error::expected 200, got $code"; exit 1; }

      - name: Round-robin reaches every registered backend
        # The real contract of a load balancer: traffic is spread,
        # not pinned to one node.
        run: |
          for i in $(seq 1 15); do
            curl -s -m 5 http://localhost:3000/ \
              | grep -o '"server":"[^"]*"'
          done | sort | uniq -c | tee /tmp/spread.txt

          distinct=$(wc -l < /tmp/spread.txt)
          echo "distinct backends hit: $distinct"
          [ "$distinct" -ge 3 ] || {
            echo "::error::expected >=3 backends in rotation, saw $distinct"
            exit 1
          }

      - name: Survives a backend crash
        # Kills node-2 via its /crash endpoint, then checks the
        # balancer keeps serving. This is the failover guarantee —
        # if it ever breaks, this step is what tells you.
        run: |
          before=$(docker inspect -f '{{.RestartCount}}' node-2)

          # Hit node-2 DIRECTLY on :3002. Going through the
          # balancer would round-robin to whichever node is next,
          # and only node-2 has a /crash endpoint.
          curl -s -m 5 http://localhost:3002/crash || true
          sleep 2

          code=$(curl -s -o /dev/null -w '%{http_code}' -m 5 http://localhost:3000/)
          echo "status during outage=$code"
          [ "$code" = "200" ] || {
            echo "::error::balancer returned $code while node-2 was down"
            exit 1
          }

          # restart: unless-stopped should bring node-2 back on its own.
          for i in $(seq 1 30); do
            after=$(docker inspect -f '{{.RestartCount}}' node-2)
            [ "$after" -gt "$before" ] && {
              echo "node-2 auto-restarted ($before -> $after)"
              exit 0
            }
            sleep 1
          done
          echo "::error::node-2 never restarted (RestartCount stayed at $before)"
          exit 1

      - name: Dump logs on failure
        # `if: failure()` makes this run ONLY when a step above failed.
        # Without it you are debugging a red build with no output.
        if: failure()
        run: |
          docker compose ps
          docker compose logs --tail 100

      - name: Tear down
        # `always()` runs this even on failure or cancellation.
        if: always()
        run: docker compose down -v
