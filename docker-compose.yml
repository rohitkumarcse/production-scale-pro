services:
  nginx:
    image: nginx:latest
    container_name: nginx-lb
    ports:
        - "8080:80"
        - "8443:443"
    networks:
      - lb-network
    depends_on:
      - load-balancer
    restart: unless-stopped
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
  mongodb:
    image: mongo:latest
    container_name: mongodb-lb
    ports:
      - "27020:27017"
    networks:
      - lb-network
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  node-1:
    image: node-1:latest
    container_name: node-1
    ports:
      - "3001:3001"
    networks:
      - lb-network
    depends_on:
      # Wait for Mongo to actually answer, not just to have started.
      mongodb:
        condition: service_healthy
    environment:
      # Falls back to the compose-internal Mongo when MONGO_URL is
      # not set — a fresh clone and CI have no .env file. A local
      # .env still overrides this.
      MONGO_URL: ${MONGO_URL:-mongodb://mongodb:27017/loadbalancer}
    restart: unless-stopped
    mem_limit: 512m
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3001/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 3

  node-2:
    image: node-2:latest
    container_name: node-2
    ports:
      - "3002:3002"
    networks:
      - lb-network
    restart: unless-stopped
    mem_limit: 512m
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3002/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 3

  node-3:
    image: node-3:latest
    container_name: node-3
    ports:
      - "3003:3003"
    networks:
      - lb-network
    depends_on:
      - mongodb
    restart: unless-stopped
    mem_limit: 512m
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3003/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 3

  node-4:
    image: node-4:latest
    container_name: node-4
    ports:
      - "3004:3004"
    networks:
      - lb-network
    depends_on:
      - mongodb
    restart: unless-stopped
    mem_limit: 512m
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3004/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 3


  load-balancer:
    image: load-balancer:latest
    container_name: load-balancer
    ports:
      - "3000:3000"
    networks:
      - lb-network
    depends_on:
      - node-1
      - node-2
      - node-3
      - node-4

networks:
  lb-network:
    driver: bridge